 }

}
function render(){document.documentElement.lang=locale;document.title="ECOBAJATOURS | "+(t()[page]||t().home)+" | "+(theme==="v3"?"Premium Night":"Azul Turquesa");topbar();let main=document.getElementById("main");main.innerHTML=page==="home"?mainHome():["cabo","san","corridor"].includes(page)?routePage(page):genericPage(page);footer();const banner=document.querySelector(".hero, .routehero");if(banner){const artKey=page==="home"?"hero":page;const scenic=stockPhoto[artKey]||stockPhoto.about;banner.style.backgroundImage='linear-gradient(100deg,rgba(3,25,46,.90),rgba(4,51,73,.36)),url("'+scenic+'")';banner.style.backgroundPosition="center";banner.style.backgroundSize="cover"}}
